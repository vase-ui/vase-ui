allowBuilds:
  # The install script only makes the launcher faster. The binary is in the platform package.
  esbuild: false
  # The install script selects the build for Vue 2 or for Vue 3. The package ships the build for Vue 3.
  vue-demi: false
minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/compiler-dom@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/compiler-sfc@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/compiler-ssr@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/compiler-vapor@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/reactivity@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/runtime-core@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/runtime-dom@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/runtime-vapor@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/server-renderer@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - '@vue/shared@3.6.0-rc.16' # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
  - vue@3.6.0-rc.16 # The Vue 3.6 tests use 3.6.0-rc.16, which is newer than the minimum release age.
packages:
  - docs
  - fixtures/*
  - packages/*
patchedDependencies:
  '@vitest/browser-playwright@5.1.0': patches/@vitest__browser-playwright@5.1.0.patch
  '@vue/language-core@3.3.14': patches/@vue__language-core@3.3.14.patch
  rolldown-plugin-dts@0.30.1: patches/rolldown-plugin-dts@0.30.1.patch
  vitepress@2.0.0-alpha.21: patches/vitepress@2.0.0-alpha.21.patch
  vue-component-meta@3.3.14: patches/vue-component-meta@3.3.14.patch
permissions:
  tsdown:
    skills: false
