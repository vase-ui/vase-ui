allowBuilds:
  # The install script only makes the launcher faster. The binary is in the platform package.
  esbuild: false
  # The install script selects the build for Vue 2 or for Vue 3. The package ships the build for Vue 3.
  vue-demi: false
# pnpm installs a release only when it is one day old. Vue 3.5.46 came out on 2026-11-20 at 08:21
# UTC. Remove these entries after 2026-11-21 at 08:21 UTC.
minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.46' # A package of Vue 3.5.46.
  - '@vue/compiler-dom@3.5.46' # A package of Vue 3.5.46.
  - '@vue/compiler-sfc@3.5.46' # A package of Vue 3.5.46.
  - '@vue/compiler-ssr@3.5.46' # A package of Vue 3.5.46.
  - '@vue/reactivity@3.5.46' # A package of Vue 3.5.46.
  - '@vue/runtime-core@3.5.46' # A package of Vue 3.5.46.
  - '@vue/runtime-dom@3.5.46' # A package of Vue 3.5.46.
  - '@vue/server-renderer@3.5.46' # A package of Vue 3.5.46.
  - '@vue/shared@3.5.46' # A package of Vue 3.5.46.
  - vue@3.5.46 # A package of Vue 3.5.46.
packages:
  - docs
  - fixtures/*
  - packages/*
patchedDependencies:
  '@vitest/browser-playwright@5.1.0': patches/@vitest__browser-playwright@5.1.0.patch
  '@vue/language-core@3.3.14': patches/@vue__language-core@3.3.14.patch
  rolldown-plugin-dts@0.30.1: patches/rolldown-plugin-dts@0.30.1.patch
  vitepress@2.0.0-alpha.21: patches/vitepress@2.0.0-alpha.21.patch
  vue-component-meta@3.3.14: patches/vue-component-meta@3.3.14.patch
permissions:
  tsdown:
    skills: false
