          - { arm: main, run: 100 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the other tree
        env:
          ARM: ${{ matrix.arm }}
        run: |
          if [ "$ARM" != main ]; then
            git fetch --depth=1 origin aad8ddf9cc2ae4fcc2a36a21a91b582f05d3d16b
            git checkout FETCH_HEAD -- docs
          fi
          echo "TREE arm=$ARM head=$(git rev-parse HEAD) demos=$(ls docs/demos/*/*/css-modules/index.vue | wc -l)"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vase-ui/vue exec playwright install --with-deps firefox
      - name: Run the suite
        env:
          ARM: ${{ matrix.arm }}
          RUN: ${{ matrix.run }}
        run: |
          nproc
          echo "PSI before: $(tr '\n' ' ' < /proc/pressure/cpu 2>&1)"
          case "$ARM" in
            one-page) set -- pnpm --filter @vase-ui/vue exec vitest run --project firefox --max-workers=1 ;;
            *) set -- pnpm test:firefox ;;
          esac
          hogs=()
          if [ "$ARM" = loaded ]; then
            for _ in $(seq 1 $(($(nproc) * 2))); do
              (while :; do :; done) &
              hogs+=("$!")
            done
          fi
          code=0
          "$@" > output.txt 2>&1 || code=$?
          if [ "${#hogs[@]}" -gt 0 ]; then kill "${hogs[@]}" 2>/dev/null || true; fi
          echo "PSI after: $(tr '\n' ' ' < /proc/pressure/cpu 2>&1)"
          cat output.txt
          failed=$(sed -E 's/\x1b\[[0-9;]*m//g' output.txt | sed -n 's/^ FAIL  *//p' | sort -u | paste -sd ';' -)
          if [ "$code" -eq 0 ]; then
            result=pass
          elif [ -n "$failed" ] && ! printf '%s\n' "$failed" | tr ';' '\n' | grep -qv 'src/collapsible/panel/'; then
            result=fail
          else
            result=other
          fi
          echo "RESULT arm=$ARM run=$RUN $result $failed"
          [ "$result" = pass ]

  required:
    if: always()
    needs: [check, test-node, test-browser, test-vue-floor, test-nuxt]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
