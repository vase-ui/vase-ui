name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Vitest collects the garbage of Chromium after a test file only when less than this number of GB is
# free in the temporary folder. A number larger than any disk makes it collect after each test file.
# Without that, a long Chromium run can lose its connection. CONTRIBUTING.md, "Where a test runs",
# gives the reason, and "Tool versions" says when to remove the variable.
env:
  VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: '1000000'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm parity:check
      - run: pnpm docs:typecheck
      - run: pnpm docs:build

  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:node

  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Firefox runs one test file at a time, so one job for all its files takes more than half
        # of the time limit. The number after the slash is the number of Firefox shards. When you
        # add or remove a shard, change that number in each Firefox shard.
        include:
          - engine: chromium
          - engine: firefox
            shard: 1/3
          - engine: firefox
            shard: 2/3
          - engine: firefox
            shard: 3/3
          - engine: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vase-ui/vue exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm test:${{ matrix.engine }} ${{ matrix.shard && format('--shard={0}', matrix.shard) }}

  test-vue-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vase-ui/vue add --save-dev --save-exact vue@3.5.12
      - run: pnpm --filter @vase-ui/vue exec playwright install --with-deps chromium
      - run: pnpm test:node
      - run: pnpm test:chromium

  test-nuxt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vase-ui/vue exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter @vase-ui/nuxt-fixture typecheck
      - run: pnpm test:nuxt

  # A prerelease of a dependency must not block a merge, so `required` does not need this job.
  # The version is the dist-tag `rc` of `vue` on npm.
  test-vue-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vase-ui/vue add --save-dev --save-exact vue@3.6.0-rc.15
      - run: pnpm --filter @vase-ui/vue exec playwright install --with-deps chromium
      - run: pnpm test:chromium

  # TEMPORARY. Put this job before `required:` in .github/workflows/ci.yml. `required` does not need it.
  # Remove it before the last push of the pull request.
  probe-hydration:
    name: probe-hydration (${{ matrix.arm }}, ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        arm: [firefox-profile]
        run: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vase-ui/vue exec playwright install --with-deps ${{ matrix.arm == 'webkit' && 'webkit' || 'firefox' }}
      - name: Machine
        run: |
          nproc
          free -m
      - name: Test
        working-directory: packages/vue
        env:
          ARM: ${{ matrix.arm }}
          PROBE_FILE: ${{ runner.temp }}/probe.jsonl
          PROBE_GC_FILE: stderr
          DEBUG: pw:browser
        run: |
          case "$ARM" in
            firefox-shard) project=firefox; target="--shard=1/3" ;;
            firefox-profile) project=firefox; target="--shard=1/3"; export PROBE_PROFILE="$RUNNER_TEMP/profile.json" ;;
            firefox-demos) project=firefox; target="test/demos.test.tsx" ;;
            webkit) project=webkit; target="" ;;
          esac
          set +e
          node --trace-gc --trace-gc-ignore-scavenger ./node_modules/vitest/vitest.mjs run --project $project $target \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/report.json" > "$RUNNER_TEMP/vitest.log" 2>&1
          echo "vitest exit $?"
          # The demos file must be in this shard. Else change the shard number of the arm.
          grep -c 'demos.test.tsx' "$RUNNER_TEMP/report.json"
          node -e '
            const r = require(process.argv[1]);
            for (const f of r.testResults) for (const a of f.assertionResults)
              if (a.duration >= 1000) console.log("SLOW", a.duration, f.name.split("/packages/vue/")[1], ">", a.fullName);
          ' "$RUNNER_TEMP/report.json"
          if [ -f "$RUNNER_TEMP/profile.json" ]; then ls -la "$RUNNER_TEMP/profile.json"; gzip -6 "$RUNNER_TEMP/profile.json"; fi
          true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.arm }}-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/probe.jsonl
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/vitest.log
            ${{ runner.temp }}/profile.json.gz
          retention-days: 7

  required:
    # Do not use `always()`. It starts this job in a cancelled run. The job waits for a runner
    # and holds the concurrency group, so the run of the new commit starts no job.
    if: ${{ !cancelled() }}
    needs: [check, test-node, test-browser, test-vue-floor, test-nuxt]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
